# frontend のイメージビルド（Cloud Build）
#
# なぜ `gcloud run deploy --source frontend` で済ませないか:
#   Dockerfile は NEXT_PUBLIC_API_URL を ARG で受ける（NEXT_PUBLIC_* はビルド時に
#   クライアントバンドルへ焼き込まれるため、ランタイム環境変数では変えられない）。
#   一方 `gcloud run deploy --set-build-env-vars` は buildpacks 向けのフラグで、
#   **Dockerfile の ARG には渡らない**。build-arg を渡すにはこの構成ファイルが要る。
#
# 使い方:
#   API_URL=$(gcloud run services describe disaster-api \
#     --project japan-disaster-alert --region asia-northeast1 --format='value(status.url)')
#   gcloud builds submit frontend --config frontend/cloudbuild.yaml \
#     --project japan-disaster-alert --substitutions _API_URL=${API_URL}
#
# フロント自身の公開 URL（_SITE_URL）も渡すとき（初回は frontend の URL が未確定なので、デプロイ後にもう一度ビルドする）:
#   WEB_URL=$(gcloud run services describe disaster-web \
#     --project japan-disaster-alert --region asia-northeast1 --format='value(status.url)')
#   gcloud builds submit frontend --config frontend/cloudbuild.yaml \
#     --project japan-disaster-alert \
#     --substitutions=_API_URL=${API_URL},_SITE_URL=${WEB_URL}
#   _SITE_URL の用途: SNS 共有の og:image を絶対 URL にする／宿の QR ポスター（/poster）の QR と
#   印字 URL をこの URL で作る（スタッフが社内 LAN や localhost でポスターを開いても、客が開ける URL になる）。
#   独自ドメインを付けたらその URL を渡す。複数の置換は「,」区切りで 1 つの --substitutions に書く

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --tag
      - ${_IMAGE}
      - .

images:
  - ${_IMAGE}

substitutions:
  # 未指定ならローカル開発の既定値。本番では必ず上書きすること
  _API_URL: http://localhost:8000
  # フロント自身の公開 URL（SNS 共有の og:image と /poster の QR 用）。
  # 空なら og:image を出さず、ポスターは開いているページの origin で QR を作る
  _SITE_URL: ''
  _IMAGE: asia-northeast1-docker.pkg.dev/japan-disaster-alert/cloud-run-source-deploy/disaster-web:latest

options:
  # 既定のサービスアカウントに専用バケットへのログ書き込み権限が無い構成でも通るようにする
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
